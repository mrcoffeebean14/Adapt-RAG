# Full self-hosted stack: the app (FastAPI API + Gradio UI, one process) plus
# Qdrant and MongoDB (official images). `docker compose up --build` runs it all.
#
# Secrets (GROQ_API_KEY, TAVILY_API_KEY, SECRET_KEY) come from .env via env_file.
# The database URLs are overridden here to the compose network names, which take
# precedence over the values in .env.
services:
  qdrant:
    image: qdrant/qdrant
    restart: unless-stopped
    # No published port: Qdrant has no auth here, so only the app (over the
    # compose network) may reach it. Add "6333:6333" locally if you want the dashboard.
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""  # local Qdrant has no auth; ignore a cloud key from .env
    ports:
      - "7860:7860"
    depends_on:
      - mongo
      - qdrant

volumes:
  qdrant_data:
  mongo_data:
